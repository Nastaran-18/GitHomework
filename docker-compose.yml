version: '3.8'

services:
  # The legacy service / backend app
  backend:
    image: ghcr.io/mccutchen/go-httpbin
    container_name: legacy_backend
    restart: always
    networks:
      - internal-net

  # The Reverse Proxy acting as the entry point
  proxy:
    image: nginx:alpine
    container_name: jwt_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge